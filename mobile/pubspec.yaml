name: reserveflash
description: >
  ReserveFlash Incident - application mobile de constat de réception (cahier
  des charges v1.1 Local-First). Stack de référence section 5.1 :
  Flutter/Dart, Riverpod, go_router, Drift, Dio.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  # section 5.1 : Android 10+ ; iOS 16+. Ces bornes sont imposées côté
  # android/app/build.gradle (minSdkVersion) et ios/Runner/Info.plist
  # (MinimumOSVersion), pas ici - ce fichier fixe seulement le SDK Dart.

dependencies:
  flutter:
    sdk: flutter

  # State management (section 5.1) - "Pas de logique métier dans les widgets."
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation (section 5.1) - deep links prévus pour dossiers/paywall.
  go_router: ^14.2.0

  # HTTP - timeouts, retries contrôlés, idempotency (section 5.1, 9.2).
  dio: ^5.5.0

  # Local DB - offline queue + cache incidents + migrations versionnées
  # (section 5.1, 8.1).
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Secure storage - tokens uniquement, jamais en clair (SEC-05).
  flutter_secure_storage: ^9.2.2

  # Caméra / audio (F02/F06/F07/F11) - la capture ne dépend jamais du réseau
  # (section 8.1).
  camera: ^0.11.0
  permission_handler: ^11.3.1
  # R1 (point 5 - "audio/note terrain") : ré-ajouté après avoir été retiré en
  # R0.2 (voir historique ci-dessous, conservé pour traçabilité). `record`
  # n'est utilisé QUE par
  # lib/features/voice_description/presentation/voice_description_screen.dart,
  # en best-effort (try/catch complet, jamais bloquant pour le reste du
  # parcours - voir docstring de ce fichier et GATE_R1_STATUS.md pour le
  # risque documenté explicitement comme demandé). Version choisie après
  # recherche (pub.dev/packages/record/changelog, R1) : 7.0.0 est passée à
  # AGP 9.x/Kotlin Gradle DSL (min Flutter 3.44/Dart 3.12), alignée sur le
  # toolchain déjà prouvé de ce projet (Flutter 3.47.0/Dart 3.13.0/Gradle
  # 9.3.1, voir CHANGELOG.md R0.2.1) - c'est le changement de dépendance
  # présentant le risque le plus élevé de ce lot R1 (seul ajout de plugin
  # natif), à vérifier en priorité lors du premier `flutter build apk
  # --debug` réel (voir mobile/README.md, section "Bootstrap"). Historique
  # R0.2 : `record: ^5.1.2` avait dû être retiré TEMPORAIREMENT - le
  # sous-paquet plateforme résolu `record_linux-0.7.2` n'implémentait pas
  # l'interface `record_platform_interface-1.6.0` (méthode `startStream`
  # manquante, signature de `hasPermission` incompatible), empêchant Dart de
  # compiler le kernel snapshot de l'app (même pour un build Android, car
  # pub résout le graphe de dépendances complet, tous plugins fédérés
  # confondus, indépendamment de la plateforme cible réelle).
  record: ^7.1.1

  # Correction ciblée post-recette terrain R1 (avant freeze final) :
  # "après capture d'une photo ou d'une note vocale, l'utilisateur ne peut
  # pas réellement contrôler le média enregistré." La note vocale
  # enregistrée par `record` (ci-dessus) devait devenir réellement
  # relisible localement (lecture/pause, durée/progression) -
  # `just_audio` est le seul ajout de plugin natif de ce correctif, donc
  # le point de risque le plus élevé, à vérifier en priorité lors du
  # prochain `flutter build apk --debug` réel (même méthode que pour
  # `record` en R1 initial - voir mobile/README.md). Version choisie
  # après recherche (pub.dev/packages/just_audio/changelog) : 0.10.6
  # ("Support AGP 9" + migration des fichiers de build Android vers
  # `.kts`) est explicitement alignée sur le toolchain déjà prouvé de ce
  # projet (Flutter 3.47.0/Dart 3.13.0/Gradle 9.3.1/AGP 9.x, voir
  # CHANGELOG.md R1) - la même génération de correctif AGP 9 que celle
  # qui avait motivé le choix de `record: ^7.1.1`. Lecture 100% locale
  # (fichier sur disque uniquement, jamais de source réseau/streaming) :
  # aucune dépendance Internet introduite (R1-T09/T10).
  just_audio: ^0.10.6

  # Icônes Material Symbols cohérentes (section 4.5).
  material_symbols_icons: ^4.2719.3

  # Partage natif du PDF exporté (F14).
  # R0.2 (hotfix decouvert par execution reelle - `flutter analyze`) :
  # `^10.0.2` autorisait uniquement des versions 10.x.x, mais le code de
  # `lib/data/share/reserve_share_service.dart` utilise l'API unifiee
  # `SharePlus.instance.share(ShareParams(...))`, introduite seulement en
  # version 11.0.0 (la classe `Share` + `shareXFiles` etait l'API des
  # versions 10.x). Consequence reelle : `flutter analyze` echouait avec
  # `Undefined name 'SharePlus'` et `The method 'ShareParams' isn't
  # defined`, car pub resolvait la derniere version 10.x compatible
  # (10.1.4), qui n'expose pas ces symboles. Verifie (changelog share_plus,
  # pub.dev) : `SharePlus`/`ShareParams` sont stables sans breaking change
  # documente jusqu'a 13.3.0 (derniere version au moment de ce correctif) ;
  # borne volontairement a `^11.0.0` (pas `^13.0.0`) pour eviter d'importer
  # en meme temps les nouvelles exigences Android Gradle Plugin
  # (>=8.12.1)/Gradle wrapper (>=8.13) des versions 12.0.0+, non testees
  # ici et hors perimetre de ce hotfix.
  share_plus: ^11.0.0

  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  uuid: ^4.4.2

  # R0.1 (Local-First) - sha256 des faits/réserves/pièces jointes (section 3,
  # 6.1) ; le Reserve Composer déterministe tourne désormais sur l'appareil
  # (voir lib/domain/reserve_composer.dart) et doit produire le même hash
  # qu'un futur recalcul serveur (comparabilité, section 6.1).
  crypto: ^3.0.3
  # R0.1 (point 9 - "Export mes données / Sauvegarde ReserveFlash") - format
  # de sauvegarde versionné = archive zip contenant la base + les pièces
  # jointes locales (voir docs/adr/0002-local-first-pivot.md).
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.19.0
  mocktail: ^1.0.4

  # R0.2 (hotfix decouvert par execution reelle - retour de recette R0.1) :
  # `riverpod_generator`, `freezed`, `json_serializable` ont ete retires
  # d'ICI (dev_dependencies, les generateurs de code) - PAS des packages
  # `riverpod_annotation`/`freezed_annotation`/`json_annotation` eux-memes,
  # qui restent en dependency normale ci-dessus pour un usage futur. Ces
  # trois generateurs, aux versions initialement pinnees, embarquent un
  # `analyzer` trop ancien (langue Dart 3.9) pour le SDK Flutter/Dart reel
  # installe par l'utilisateur (3.47.0 / langue Dart 3.13) : `build_runner
  # build` plantait avec `Exception: Missing implementation of
  # visitDotShorthandPropertyAccess` en essayant d'analyser le code source
  # du SDK Flutter lui-meme (pas notre code). Verification faite avant
  # suppression : AUCUN fichier de ce depot n'utilise `@riverpod`, `@freezed`
  # ni `@JsonSerializable` (grep sur lib/, zero resultat) - ces trois
  # generateurs etaient donc presents par anticipation mais totalement
  # inutilises, retirer leur declaration n'enleve donc aucune fonctionnalite
  # testee. A ré-ajouter avec des versions a jour (compatibles Dart 3.13+)
  # le jour ou du code annoté avec l'un de ces trois est reellement introduit
  # (probable en R1+, ecrans/etat).

flutter:
  uses-material-design: true
  # Polices système par plateforme (section 4.3 : Roboto Android / SF Pro
  # iOS) - aucune police embarquée, donc aucune dépendance réseau pour la
  # typographie et aucune entrée `fonts:` ici.
  assets: []
