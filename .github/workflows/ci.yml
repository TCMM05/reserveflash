name: CI

# section 5.1 - "CI/CD: GitHub Actions | Lint + tests + secret scan + build
# staging." section 15.4 / 16.1 : les tests obligatoires du domaine/composer
# doivent passer, un secret dans le dépôt est un motif de rejet automatique.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  # R0.2.2 (aligne sur l'environnement REELLEMENT prouve par execution -
  # voir CHANGELOG.md "R0.2.1 Hotfix" et docs/GATE_R0.1_STATUS.md) : cette
  # valeur etait auparavant 3.24.5, jamais executee ni prouvee dans ce
  # depot - le build reel qui a produit 52/52 tests verts et l'APK debug
  # a tourne sous Flutter 3.47.0 / Dart 3.13.0 (confirme par
  # `flutter --version` dans le log d'execution reelle). Une CI sur une
  # version differente de celle prouvee ne serait pas reproductible au
  # sens strict - elle pourrait echouer ou reussir pour des raisons
  # totalement independantes du code.
  FLUTTER_VERSION: "3.47.0"

jobs:
  backend:
    name: Backend - lint, tests, OpenAPI, migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reserveflash
          POSTGRES_PASSWORD: reserveflash
          POSTGRES_DB: reserveflash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reserveflash"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RESERVEFLASH_DATABASE_URL: postgresql+psycopg://reserveflash:reserveflash@localhost:5432/reserveflash
      RESERVEFLASH_AI_PROVIDER: mock
      RESERVEFLASH_STORAGE_PROVIDER: mock
      RESERVEFLASH_AUTH_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install backend + dev dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: python -m ruff check app tests scripts alembic/env.py

      - name: Apply migrations (Alembic - section 5.1 "aucune migration manuelle production")
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Verify models match latest migration (no drift)
        working-directory: backend
        run: python -m alembic check

      - name: Run tests (domain + API + DB, section 15.4)
        working-directory: backend
        run: python -m pytest tests -q --cov=app --cov-report=term-missing

      - name: Regenerate OpenAPI and fail if committed spec is stale (section 9.2)
        working-directory: backend
        run: |
          python scripts/generate_openapi.py
          git diff --exit-code openapi.json

      - name: Secret scan of Python source (belt-and-suspenders in addition to gitleaks job)
        working-directory: backend
        run: |
          if grep -RInE "(sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})" app scripts; then
            echo "Motif de clé API détecté dans le code source - rejet (GATE secret, section 5.3)."
            exit 1
          fi

  mobile:
    name: Mobile - analyze, test, build debug (Gate R0.1, point 15)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate platform folders (mobile/README.md "Premstrap")
        working-directory: mobile
        run: flutter create . --org com.reserveflash --platforms=android,ios

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate code (Drift/Riverpod/freezed)
        working-directory: mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: "Test (domain + widgets, section 15.4 - inclut les tests adversariaux liability_guard_test.dart / reserve_composer_test.dart, R0.1 point 8)"
        working-directory: mobile
        run: flutter test

      - name: 'Build Android debug APK (Gate R0.1, point 1 - "application Flutter compilable")'
        working-directory: mobile
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: reserveflash-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  secret-scan:
    name: Secret scan (gitleaks - section 5.1, 16.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-staging:
    name: Build staging image (backend)
    runs-on: ubuntu-latest
    needs: [backend, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: |
          docker build -f infra/docker/backend/Dockerfile -t reserveflash-backend:staging .
