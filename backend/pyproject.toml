[project]
name = "reserveflash-backend"
version = "0.1.0"
description = "ReserveFlash Incident - backend FastAPI (section 5, 9 du cahier des charges v1.0)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-jose[cryptography]>=3.3",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "jsonschema>=4.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# Fichiers auto-générés par `alembic revision --autogenerate` : le style de
# sortie d'Alembic ne suit pas nos conventions de ligne, et ces fichiers ne
# doivent plus être retouchés une fois appliqués (section 5.1 - "aucune
# migration manuelle production").
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
