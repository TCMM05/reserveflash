[build-system]
# R0.2.2 (bug decouvert par la premiere execution reelle de la CI GitHub
# Actions - voir CHANGELOG.md) : sans cette section, pip choisit quand meme
# setuptools par defaut, mais laisse sa decouverte automatique de paquets
# scanner tout `backend/` en "flat layout". Ce dossier contient DEUX
# repertoires au premier niveau avec du code Python (`app/` et `alembic/`),
# donc setuptools >= 61 refuse de construire ("Multiple top-level packages
# discovered in a flat-layout") - erreur jamais vue localement car les
# tests tournent via `pytest` (qui utilise `pythonpath = ["."]` ci-dessous
# sans jamais installer le paquet), pas via `pip install -e ".[dev]"` comme
# le fait la CI. D'ou la necessite de lister explicitement le paquet a
# construire.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Seul `app/` est le paquet applicatif a installer. `alembic/` (migrations,
# invoquees via la CLI `alembic` depuis le dossier `backend/`, pas via un
# import Python) et `tests/`/`scripts/` ne doivent pas etre traites comme
# des paquets installables.
include = ["app*"]

[project]
name = "reserveflash-backend"
version = "0.1.0"
description = "ReserveFlash Incident - backend FastAPI (section 5, 9 du cahier des charges v1.1 Local-First)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "python-jose[cryptography]>=3.3",
    "structlog>=24.1",
    # R2 : app/infrastructure/ai/openai_provider.py appelle l'API HTTP
    # d'OpenAI directement via httpx (déjà présent en dev pour
    # fastapi.testclient) - désormais une dépendance d'exécution réelle, pas
    # seulement de test.
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "jsonschema>=4.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# Fichiers auto-générés par `alembic revision --autogenerate` : le style de
# sortie d'Alembic ne suit pas nos conventions de ligne, et ces fichiers ne
# doivent plus être retouchés une fois appliqués (section 5.1 - "aucune
# migration manuelle production").
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
