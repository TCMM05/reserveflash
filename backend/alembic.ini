[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# section 5.1 : "Aucune migration manuelle production." L'URL réelle vient
# TOUJOURS de la variable d'environnement RESERVEFLASH_DATABASE_URL (voir
# alembic/env.py) ; cette valeur ici n'est qu'un fallback de développement
# local sans secret (mot de passe de dev non sensible, jamais utilisé en
# production).
sqlalchemy.url = postgresql+psycopg://reserveflash:reserveflash@localhost:5432/reserveflash

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
